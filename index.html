<html lang="pt-BR">
<head>

<title>Tirzeton Labs</title>
<meta name="description" content="Tirzeton Labs — produtos selecionados a dedo. Finalize seu pedido pelo WhatsApp." />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Tirzeton Labs" />
<meta property="og:title" content="Tirzeton Labs" />
<meta property="og:description" content="Tirzeton Labs — produtos selecionados a dedo. Finalize seu pedido pelo WhatsApp." />
<meta property="og:image" content="assets/logo.png" />
<meta property="og:image:alt" content="Tirzeton Labs" />
<meta property="og:url" content="https://tirzeton-labs.github.io/tirzeton-labs/" />
<meta property="og:locale" content="pt_BR" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Tirzeton Labs" />
<meta name="twitter:description" content="Tirzeton Labs — produtos selecionados a dedo. Finalize seu pedido pelo WhatsApp." />
<meta name="twitter:image" content="assets/logo.png" />

<link rel="canonical" href="https://tirzeton-labs.github.io/tirzeton-labs/" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/favicon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />

<script>
(function () {
  try {
    var saved = localStorage.getItem("tirzeton_theme");
    var system = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = saved || (system ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
:root {
  --bg:           #fafaf9;
  --surface:      #ffffff;
  --surface-2:    #f5f5f4;
  --surface-3:    #ebe9e7;
  --border:       #e7e5e4;
  --border-2:     #d6d3d1;
  --text:         #1c1917;
  --text-2:       #57534e;
  --text-3:       #a8a29e;
  --accent:       #1c1917;
  --accent-fg:    #fafaf9;
  --whatsapp:     #25d366;
  --whatsapp-dk:  #1fb955;
  --danger:       #dc2626;

  --shadow-xs: 0 1px 2px rgba(28,25,23,.04);
  --shadow-sm: 0 2px 8px rgba(28,25,23,.05);
  --shadow:    0 4px 18px rgba(28,25,23,.06), 0 1px 2px rgba(28,25,23,.04);
  --shadow-lg: 0 24px 48px rgba(28,25,23,.10), 0 4px 12px rgba(28,25,23,.05);
  --shadow-inset: inset 0 1px 0 rgba(255,255,255,.6);

  --r-xs: 8px;
  --r-sm: 12px;
  --r:    20px;
  --r-lg: 28px;
  --r-xl: 36px;

  --ease: cubic-bezier(.22,.61,.36,1);
  --t: 240ms var(--ease);
  --t-fast: 160ms var(--ease);
  --t-slow: 380ms var(--ease);
}

[data-theme="dark"] {
  --bg:           #0c0c0c;
  --surface:      #161616;
  --surface-2:    #1f1f1f;
  --surface-3:    #2a2a2a;
  --border:       #262626;
  --border-2:     #404040;
  --text:         #fafaf9;
  --text-2:       #a8a29e;
  --text-3:       #57534e;
  --accent:       #fafaf9;
  --accent-fg:    #0c0c0c;

  --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
  --shadow:    0 4px 18px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.35);
  --shadow-lg: 0 24px 48px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.35);
  --shadow-inset: inset 0 1px 0 rgba(255,255,255,.04);
}

html.theming-transition,
html.theming-transition *,
html.theming-transition *::before,
html.theming-transition *::after {
  transition: background-color 320ms var(--ease),
              color 320ms var(--ease),
              border-color 320ms var(--ease) !important;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { color-scheme: light dark; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.005em;
  min-height: 100dvh;
  font-feature-settings: "cv11", "ss01";
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  cursor: pointer;
  border: 0;
  background: none;
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent); color: var(--accent-fg); }
button, .chip, .card, [data-action], .input, .stepper button { touch-action: manipulation; }

.btn {
  appearance: none;
  height: 44px;
  padding: 0 18px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.005em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  border: 1px solid transparent;
  transition: background-color var(--t), color var(--t),
              border-color var(--t), transform var(--t-fast),
              box-shadow var(--t);
}
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.btn svg { width: 16px; height: 16px; flex: 0 0 auto; }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { box-shadow: var(--shadow-sm); }
.btn-ghost { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-3); border-color: var(--border-2); }
.btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
.btn-outline:hover { border-color: var(--text); }
.btn-whatsapp {
  background: var(--whatsapp);
  color: #fff;
  height: 56px;
  font-size: 15px;
  padding: 0 24px;
}
.btn-whatsapp:hover { background: var(--whatsapp-dk); }
.btn-whatsapp:disabled { opacity: .65; cursor: wait; }
.btn-icon {
  width: 44px; height: 44px;
  padding: 0;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  display: inline-grid;
  place-items: center;
}
.btn-icon:hover { background: var(--surface-3); border-color: var(--border-2); }
.btn-icon svg { width: 18px; height: 18px; }
.btn-sm { height: 36px; padding: 0 14px; font-size: 13px; }

.input {
  width: 100%;
  height: 46px;
  padding: 0 16px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid transparent;
  color: var(--text);
  outline: none;
  transition: background-color var(--t), border-color var(--t), box-shadow var(--t);
}
.input::placeholder { color: var(--text-3); }
.input:focus { background: var(--surface); border-color: var(--border-2); box-shadow: 0 0 0 4px var(--surface-3); }

.chip {
  flex: 0 0 auto;
  height: 36px;
  padding: 0 16px;
  border-radius: 999px;
  background: transparent;
  color: var(--text-2);
  border: 1px solid var(--border);
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all var(--t-fast);
}
.chip:hover { color: var(--text); border-color: var(--border-2); }
.chip.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip .chip-count {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--text-2);
}
.chip.active .chip-count { background: rgba(255,255,255,.18); color: inherit; }
[data-theme="dark"] .chip.active .chip-count { background: rgba(0,0,0,.25); }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  line-height: 1;
  border: 1px solid currentColor;
}
.badge--novo        { color: #0d9488; }
.badge--lancamento  { color: #9333ea; }
.badge--promocao    { color: #ea580c; }
.badge--mais-vendido{ color: #ca8a04; }
.badge--esgotado    { color: var(--danger); }
.badge--exclusivo   { color: #2563eb; }
[data-theme="dark"] .badge--novo        { color: #5eead4; }
[data-theme="dark"] .badge--lancamento  { color: #d8b4fe; }
[data-theme="dark"] .badge--promocao    { color: #fed7aa; }
[data-theme="dark"] .badge--mais-vendido{ color: #fde047; }
[data-theme="dark"] .badge--esgotado    { color: #fca5a5; }
[data-theme="dark"] .badge--exclusivo   { color: #93c5fd; }

.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: saturate(160%) blur(20px);
  -webkit-backdrop-filter: saturate(160%) blur(20px);
  border-bottom: 1px solid transparent;
  transition: border-color var(--t), background-color var(--t);
}
.header.scrolled { border-bottom-color: var(--border); }
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  height: 80px;
  padding: 0 24px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text);
  transition: opacity var(--t-fast);
}
.logo:hover { opacity: .7; }
.logo .dot {
  width: 6px; height: 6px;
  border-radius: 999px;
  background: var(--accent);
  margin-top: 2px;
}

.search-wrap {
  position: relative;
  max-width: 480px;
  width: 100%;
  justify-self: center;
}
.search-wrap .search-ico {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px;
  color: var(--text-3);
  pointer-events: none;
}
.search-wrap .input { padding-left: 42px; }

.header-actions { display: flex; gap: 8px; align-items: center; }

.theme-toggle { position: relative; overflow: hidden; }
.theme-toggle svg { transition: transform 380ms var(--ease), opacity 240ms var(--ease); }
.theme-toggle .sun { display: block; }
.theme-toggle .moon { display: none; }
[data-theme="dark"] .theme-toggle .sun { display: none; }
[data-theme="dark"] .theme-toggle .moon { display: block; }

.cart-btn {
  position: relative;
  height: 44px;
  padding: 0 14px 0 12px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-fg);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  transition: transform var(--t-fast), box-shadow var(--t);
}
.cart-btn:hover { box-shadow: var(--shadow); }
.cart-btn:active { transform: scale(.97); }
.cart-btn svg { width: 18px; height: 18px; }
.cart-btn .cart-pill {
  min-width: 22px; height: 22px;
  padding: 0 7px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--accent-fg) 22%, transparent);
  font-size: 12px; font-weight: 700;
  display: grid; place-items: center;
  font-variant-numeric: tabular-nums;
}
.cart-btn .cart-pill.bump { animation: bump 420ms var(--ease); }
@keyframes bump {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.35); }
  100% { transform: scale(1); }
}

@media (max-width: 760px) {
  .header-inner {
    grid-template-columns: 1fr auto;
    grid-template-areas: "logo actions" "search search";
    height: auto;
    padding: 14px 18px 12px;
    row-gap: 12px;
  }
  .logo { grid-area: logo; font-size: 16px; }
  .header-actions { grid-area: actions; }
  .search-wrap { grid-area: search; max-width: none; }
  .cart-btn .cart-label { display: none; }
}

main { max-width: 1280px; margin: 0 auto; padding: 32px 24px 96px; }
@media (max-width: 760px) { main { padding: 20px 18px 96px; } }

.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 4px 0 18px;
  margin-bottom: 8px;
  -webkit-overflow-scrolling: touch;
}
.filters::-webkit-scrollbar { display: none; }

.meta-bar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 18px;
  font-size: 13px;
  color: var(--text-2);
}
.meta-bar strong { color: var(--text); font-weight: 600; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}
@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
}

.card {
  position: relative;
  background: var(--surface);
  border-radius: var(--r-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-xs);
  transition: transform var(--t), box-shadow var(--t);
  isolation: isolate;
}
@media (hover: hover) {
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .card:hover .card-media-img { transform: scale(1.04); }
}
.card.is-out .card-media-img { filter: grayscale(.8) brightness(.85); }
[data-theme="dark"] .card.is-out .card-media-img { filter: grayscale(.8) brightness(.7); }
.card-link { display: contents; cursor: pointer; }
.card-media {
  position: relative;
  aspect-ratio: 1/1;
  background: var(--surface-2);
  overflow: hidden;
  cursor: pointer;
}
.card-media-img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--t-slow); }
.card-cat {
  position: absolute; top: 12px; left: 12px;
  padding: 5px 12px; border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 11px; font-weight: 600; letter-spacing: .02em;
  color: var(--text); border: 1px solid var(--border);
}
.card-badges {
  position: absolute; top: 12px; right: 12px;
  display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
}
.card-badges .badge {
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-title { font-size: 15px; font-weight: 600; line-height: 1.3; margin: 0; letter-spacing: -0.01em; color: var(--text); }
.card-summary { font-size: 13px; color: var(--text-2); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 6px; }
.card-price { font-size: 16px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.card-price small { font-size: 11px; font-weight: 500; color: var(--text-3); display: inline-block; margin-top: -2px; }
.card-noprice { font-size: 12px; color: var(--text-2); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
.card-add {
  width: 38px; height: 38px; border-radius: 999px;
  background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center;
  transition: transform var(--t-fast), background-color var(--t);
  flex: 0 0 auto;
}
.card-add:hover { transform: scale(1.06); }
.card-add:active { transform: scale(.94); }
.card-add svg { width: 16px; height: 16px; }
.card-add:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.skeleton { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; }
.skeleton .sk-media, .skeleton .sk-line {
  background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%);
  background-size: 200% 100%; animation: shimmer 1.4s linear infinite;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skeleton .sk-media { aspect-ratio: 1/1; }
.skeleton .sk-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
.skeleton .sk-line { height: 13px; border-radius: 6px; }
.skeleton .sk-line.short { width: 50%; }
.skeleton .sk-line.long { width: 90%; }
.skeleton .sk-line.med { width: 70%; }

.empty { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--text-2); }
.empty h3 { font-size: 18px; font-weight: 600; margin: 0 0 6px; color: var(--text); }
.empty p { margin: 0; font-size: 14px; }

.ph { width: 100%; height: 100%; background: linear-gradient(135deg, var(--surface-2) 0%, var(--surface-3) 100%); display: grid; place-items: center; color: var(--text-3); }
.ph svg { width: 32%; height: 32%; opacity: .5; }

.overlay {
  position: fixed; inset: 0;
  background: color-mix(in srgb, var(--bg) 0%, #000 35%);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity var(--t);
}
.overlay.show { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(460px, 100%); background: var(--surface);
  z-index: 110; transform: translateX(100%);
  transition: transform 360ms var(--ease);
  display: flex; flex-direction: column;
  border-left: 1px solid var(--border);
}
.drawer.show { transform: translateX(0); }
.drawer-head { padding: 22px 24px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.drawer-head .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin: 0 0 4px; }
.drawer-head h2 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.015em; }
.drawer-head h2 .count { font-size: 16px; color: var(--text-3); font-weight: 500; margin-left: 4px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 4px 24px; -webkit-overflow-scrolling: touch; }
.drawer-foot { padding: 20px 24px calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 14px; }

.cart-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--border); animation: rowIn 320ms var(--ease) both; }
.cart-row:last-child { border-bottom: 0; }
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.cart-row .cart-thumb { width: 72px; height: 72px; border-radius: 16px; background: var(--surface-2); overflow: hidden; }
.cart-row .cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
.cart-row .cart-info { min-width: 0; }
.cart-row .cart-name { font-size: 14px; font-weight: 600; margin: 0; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart-row .cart-meta { font-size: 12px; color: var(--text-3); margin: 2px 0 0; }
.cart-row .cart-price { font-size: 13px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; margin-top: 6px; }
.cart-row .cart-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 6px; }
.cart-row .cart-remove { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; color: var(--text-3); transition: color var(--t-fast), background-color var(--t-fast); }
.cart-row .cart-remove:hover { background: var(--surface-2); color: var(--danger); }
.cart-row .cart-remove svg { width: 14px; height: 14px; }

.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 999px; padding: 3px; border: 1px solid var(--border); }
.stepper button { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; color: var(--text); transition: background-color var(--t-fast); }
.stepper button:hover { background: var(--surface); }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper button svg { width: 12px; height: 12px; }
.stepper .qty { min-width: 22px; text-align: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

.summary { display: flex; flex-direction: column; gap: 6px; }
.summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); }
.summary-row.total { padding-top: 10px; margin-top: 4px; border-top: 1px dashed var(--border); font-size: 18px; font-weight: 700; color: var(--text); }
.summary-row span:last-child { font-variant-numeric: tabular-nums; }

.cart-form { display: grid; gap: 10px; }
.cart-form .field { display: grid; gap: 6px; }
.cart-form .field label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); }
.cart-form .field.error .input { border-color: var(--danger); box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 12%, transparent); }
.cart-form .field .err { display: none; font-size: 12px; color: var(--danger); }
.cart-form .field.error .err { display: block; }

.cart-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 60px 20px; gap: 14px; }
.cart-empty .icon { width: 64px; height: 64px; border-radius: 999px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-3); }
.cart-empty .icon svg { width: 28px; height: 28px; }
.cart-empty h3 { margin: 0; font-size: 18px; font-weight: 600; }
.cart-empty p { margin: 0; font-size: 14px; color: var(--text-2); }

.modal { position: fixed; inset: 0; z-index: 110; display: none; place-items: center; padding: 24px; background: rgba(0,0,0,0.45); }
.modal.show { display: grid; }
.modal-card {
  background: var(--surface); border-radius: var(--r-xl);
  width: min(960px, 100%); max-height: calc(100dvh - 48px);
  overflow: hidden; display: grid; grid-template-columns: 1.05fr 1fr;
  opacity: 0; transform: translateY(14px) scale(0.985);
  transition: opacity var(--t), transform var(--t);
  pointer-events: auto; box-shadow: var(--shadow-lg); position: relative;
}
.modal.show .modal-card { opacity: 1; transform: translateY(0) scale(1); }
.modal-close { position: absolute; top: 16px; right: 16px; z-index: 2; }
.modal-share { position: absolute; top: 16px; right: 68px; z-index: 2; }

.gallery-main { width: 100%; aspect-ratio: 1/1; background: var(--surface-2); border-radius: 12px; overflow: hidden; }
.gallery-main img, .gallery-main .ph { width: 100%; height: 100%; object-fit: cover; }
.gallery-thumbs { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
.gallery-thumb { flex: 0 0 72px; height: 72px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; padding: 0; background: none; transition: border-color var(--t); }
.gallery-thumb.active { border-color: var(--primary); }
.gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

.modal-body { padding: 36px 36px 28px; overflow-y: auto; display: flex; flex-direction: column; }
.modal-cat { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin-bottom: 10px; }
.modal-title { font-size: 28px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.02em; line-height: 1.15; }
.modal-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 18px; }
.modal-desc { color: var(--text-2); font-size: 15px; margin: 0 0 24px; line-height: 1.6; }
.modal-price-row { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.modal-price-row .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }
.modal-price-row .value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.modal-price-row .value small { font-size: 12px; color: var(--text-3); font-weight: 500; margin-left: 4px; }
.modal-bottom { margin-top: auto; display: flex; gap: 12px; align-items: center; }
.modal-bottom .stepper { padding: 4px; }
.modal-bottom .stepper button { width: 36px; height: 36px; }
.modal-bottom .stepper .qty { font-size: 15px; min-width: 28px; }
.modal-bottom .btn-primary { flex: 1; height: 52px; }

@media (max-width: 760px) {
  .modal { padding: 0; align-items: stretch; }
  .modal-card { grid-template-columns: 1fr; max-height: 100dvh; height: 100dvh; border-radius: 0; display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .carousel { aspect-ratio: auto; height: 60vw; max-height: 380px; }
  .modal-body { padding: 24px 22px 28px; display: block; overflow: visible; }
  .modal-title { font-size: 24px; }
  .modal-bottom { position: sticky; bottom: 0; background: var(--surface); margin: 16px -22px -28px; padding: 16px 22px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
  .modal-close { background: var(--surface); position: fixed; }
  .modal-share { background: var(--surface); position: fixed; }
}

.toast {
  position: fixed; left: 50%; bottom: 28px;
  transform: translateX(-50%) translateY(24px);
  background: var(--text); color: var(--bg);
  padding: 12px 20px; border-radius: 999px;
  font-size: 14px; font-weight: 600; z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity var(--t), transform var(--t);
  box-shadow: var(--shadow-lg);
  display: inline-flex; align-items: center; gap: 10px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { width: 16px; height: 16px; }

.footer { border-top: 1px solid var(--border); padding: 32px 24px 60px; text-align: center; color: var(--text-3); font-size: 12px; letter-spacing: 0.02em; }
.footer a { color: var(--text-2); }
.footer a:hover { color: var(--text); }

.bookmark-banner {
  position: fixed; bottom: 20px; right: 20px; left: 20px;
  max-width: 400px; margin-left: auto;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 16px;
  display: none; align-items: center; gap: 12px;
  box-shadow: var(--shadow-lg); z-index: 150;
  opacity: 0; transform: translateY(20px);
  transition: opacity var(--t), transform var(--t);
}
.bookmark-banner.show { display: flex; }
.bookmark-banner.in { opacity: 1; transform: translateY(0); }
.bm-icon { width: 40px; height: 40px; border-radius: 999px; background: var(--surface-2); display: grid; place-items: center; color: var(--text); flex: 0 0 auto; }
.bm-icon svg { width: 18px; height: 18px; }
.bm-content { flex: 1; min-width: 0; }
.bm-title { font-size: 14px; font-weight: 700; margin: 0; line-height: 1.2; letter-spacing: -0.005em; }
.bm-text { font-size: 12px; color: var(--text-2); margin: 3px 0 0; line-height: 1.4; }
.bm-actions { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.bm-actions .btn-sm { padding: 0 12px; height: 32px; }
.bm-close { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; color: var(--text-3); transition: background-color var(--t-fast), color var(--t-fast); }
.bm-close:hover { background: var(--surface-2); color: var(--text); }
.bm-close svg { width: 12px; height: 12px; }
@media (max-width: 600px) {
  .bookmark-banner { right: 12px; left: 12px; bottom: 12px; max-width: none; padding: 12px 14px; }
  .bm-title { font-size: 13px; }
  .bm-text { font-size: 11px; }
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header class="header" id="header">
  <div class="header-inner">
    <a href="index.html" class="logo" aria-label="Tirzeton Labs — voltar à loja">
      Tirzeton Labs
      <span class="dot" aria-hidden="true"></span>
    </a>

    <div class="search-wrap">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="searchInput" class="input" placeholder="Buscar produtos…" aria-label="Buscar produtos" />
    </div>

    <div class="header-actions">
      <button class="btn-icon theme-toggle" id="themeToggle" aria-label="Alternar tema">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="cart-btn" id="openCartBtn" aria-label="Abrir carrinho">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-label">Sacola</span>
        <span class="cart-pill" id="cartPill">0</span>

    </div>
  </div>
</header>

<main>
  <nav class="filters" id="filters" aria-label="Categorias"></nav>

  <div class="meta-bar" id="metaBar">
    <span><strong id="metaCount">—</strong> <span id="metaContext"></span></span>
  </div>

  <section class="grid" id="grid" aria-label="Produtos"></section>
</main>

<footer class="footer">
  <p>Tirzeton Labs · Pedidos via WhatsApp <a id="footerWa" href="#"></a></p>
</footer>

<div class="bookmark-banner" id="bookmarkBanner" role="dialog" aria-label="Adicionar à tela inicial">
  <div class="bm-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
  </div>
  <div class="bm-content">
    <p class="bm-title" id="bookmarkTitle">Acesso rápido</p>
    <p class="bm-text" id="bookmarkText">Adicione à tela inicial para abrir mais rápido.</p>
  </div>
  <div class="bm-actions">
    <button type="button" class="btn btn-primary btn-sm" id="bookmarkAddBtn">Adicionar</button>
    <button type="button" class="bm-close" id="bookmarkCloseBtn" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer" aria-label="Sacola de compras" aria-hidden="true">
  <header class="drawer-head">
    <div>
      <p class="label">Sua sacola</p>
      <h2>Pedido <span class="count" id="drawerCount">vazio</span></h2>
    </div>
    <button class="btn-icon" id="closeCartBtn" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
  <footer class="drawer-foot" id="drawerFoot"></footer>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Detalhes do produto">
  <div class="modal-card" id="modalCard"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastText">Adicionado</span>
</div>

<script>
/* =========================================================
   CONFIGURAÇÕES
   ========================================================= */
const WHATSAPP_NUMERO = "5517982094026";
const STORAGE_CART = "tirzeton_cart_v2";
const STORAGE_THEME = "tirzeton_theme";

const DEFAULT_CATEGORIAS = [];

const DEFAULT_PRODUTOS = [];

const BADGE_LABELS = {
  novo: "Novo", lancamento: "Lançamento", promocao: "Promoção",
  "mais-vendido": "Mais vendido", esgotado: "Esgotado", exclusivo: "Exclusivo"
};

/* =========================================================
   STATE
   ========================================================= */
let categorias = [];
let produtos = [];
let whatsappNumero = WHATSAPP_NUMERO;

const state = {
  busca: "",
  categoria: "Todos",
  carrinho: [],
  modalProductId: null,
  modalSlide: 0,
  loading: true,
};

/* =========================================================
   HELPERS
   ========================================================= */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const fmt = (n) => new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL" }).format(n);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slugify = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "produto";

function bySlug(slug) {
  return produtos.find(p => p.id === slug || slugify(p.nome) === slug);
}

const phSVG = `
  <div class="ph" role="img" aria-label="sem foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="4"/>
      <circle cx="9" cy="9" r="2"/>
      <path d="m21 15-5-5L5 21"/>
    </svg>
  </div>`;

function imgOrPh(src, alt) {
  return src
    ? `<img class="card-media-img" alt="${esc(alt)}" src="${esc(src)}" />`
    : phSVG;
}

/* =========================================================
   THEME
   ========================================================= */
function applyTheme(theme) {
  document.documentElement.classList.add("theming-transition");
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem(STORAGE_THEME, theme);
  setTimeout(() => document.documentElement.classList.remove("theming-transition"), 360);
}
$("#themeToggle").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(cur === "dark" ? "light" : "dark");
});

/* =========================================================
   LOAD DATA
   ========================================================= */
async function loadDados() {
  try {
    const res = await fetch("data/produtos.json", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data.produtos)) {
        produtos = data.produtos;
        categorias = Array.isArray(data.categorias) && data.categorias.length
          ? data.categorias.filter(c => c !== "Todos")
          : [];
        if (data.whatsapp) whatsappNumero = data.whatsapp;
        return;
      }
    }
  } catch {}
  produtos = [];
  categorias = [];
}

/* =========================================================
   CART
   ========================================================= */
function loadCart() {
  try {
    const raw = localStorage.getItem(STORAGE_CART);
    state.carrinho = raw ? JSON.parse(raw) : [];
  } catch { state.carrinho = []; }
}
function saveCart() { localStorage.setItem(STORAGE_CART, JSON.stringify(state.carrinho)); }

function addToCart(p, qty=1) {
  if ((p.badges||[]).includes("esgotado")) { toast("Produto esgotado", "warn"); return; }
  const ex = state.carrinho.find(i => i.id === p.id);
  if (ex) ex.qty += qty;
  else state.carrinho.push({
    id: p.id, nome: p.nome, medida: p.medida,
    preco: p.preco ?? null, imagem: p.imagens?.[0] || "", qty
  });
  saveCart();
  renderCartPill(true);
  renderDrawer();
  toast("Adicionado à sacola");
}
function changeQty(id, delta) {
  const it = state.carrinho.find(i => i.id === id);
  if (!it) return;
  it.qty = Math.max(0, it.qty + delta);
  if (it.qty === 0) state.carrinho = state.carrinho.filter(i => i.id !== id);
  saveCart(); renderCartPill(); renderDrawer();
}
function removeFromCart(id) {
  state.carrinho = state.carrinho.filter(i => i.id !== id);
  saveCart(); renderCartPill(); renderDrawer();
}
const totalItens = () => state.carrinho.reduce((s,i) => s + i.qty, 0);
const totalValor = () => state.carrinho.reduce((s,i) => s + (i.preco ? i.preco * i.qty : 0), 0);
const temPreco = () => state.carrinho.some(i => i.preco != null);

/* =========================================================
   RENDER: filters
   ========================================================= */
function renderFilters() {
  const cats = ["Todos", ...categorias];
  const counts = {};
  produtos.filter(p => p.ativo !== false).forEach(p => {
    counts[p.categoria] = (counts[p.categoria]||0) + 1;
  });
  counts["Todos"] = produtos.filter(p => p.ativo !== false).length;

  $("#filters").innerHTML = cats.map(c => `
    <button type="button" class="chip ${c === state.categoria ? "active" : ""}" data-cat="${esc(c)}">
      ${esc(c)}
      <span class="chip-count">${counts[c]||0}</span>
    </button>
  `).join("");
  $$("#filters .chip").forEach(b => {
    b.addEventListener("click", () => {
      state.categoria = b.dataset.cat;
      renderFilters(); renderGrid();
    });
  });
}

/* =========================================================
   RENDER: grid
   ========================================================= */
function filteredProdutos() {
  const q = state.busca.trim().toLowerCase();
  return produtos
    .filter(p => p.ativo !== false)
    .filter(p => state.categoria === "Todos" || p.categoria === state.categoria)
    .filter(p => !q
      || (p.nome||"").toLowerCase().includes(q)
      || (p.resumo||"").toLowerCase().includes(q)
      || (p.descricao||"").toLowerCase().includes(q));
}

function renderSkeletons() {
  const grid = $("#grid");
  grid.innerHTML = Array.from({length: 8}).map(() => `
    <div class="skeleton">
      <div class="sk-media"></div>
      <div class="sk-body">
        <div class="sk-line long"></div>
        <div class="sk-line med"></div>
        <div class="sk-line short"></div>
      </div>
    </div>
  `).join("");
  $("#metaCount").textContent = "…";
  $("#metaContext").textContent = "Carregando produtos";
}

function renderGrid() {
  const grid = $("#grid");
  const lista = filteredProdutos();
  $("#metaCount").textContent = lista.length;
  $("#metaContext").textContent =
    `${lista.length === 1 ? "produto" : "produtos"}` +
    (state.categoria !== "Todos" ? ` em ${state.categoria}` : "") +
    (state.busca ? ` para "${state.busca}"` : "");

  if (!lista.length) {
    grid.innerHTML = `<div class="empty"><h3>Nada por aqui</h3><p>Tente outra busca ou troque de categoria.</p></div>`;
    return;
  }

  grid.innerHTML = lista.map(p => {
    const isOut = (p.badges||[]).includes("esgotado");
    const badges = (p.badges||[]).map(b => `<span class="badge badge--${esc(b)}">${BADGE_LABELS[b]||b}</span>`).join("");
    return `
    <article class="card ${isOut ? "is-out" : ""}" data-id="${esc(p.id)}">
      <a class="card-media" href="?p=${esc(p.id)}" data-nav="${esc(p.id)}" aria-label="${esc(p.nome)}">
        <span class="card-cat">${esc(p.categoria||"")}</span>
        ${badges ? `<div class="card-badges">${badges}</div>` : ""}
        ${imgOrPh(p.imagens?.[0], p.nome)}
      </a>
      <div class="card-body">
        <a href="?p=${esc(p.id)}" data-nav="${esc(p.id)}" style="color:inherit">
          <h3 class="card-title">${esc(p.nome)}</h3>
        </a>
        <p class="card-summary">${esc(p.resumo||"")}</p>
        <div class="card-foot">
          ${p.preco != null
            ? `<div class="card-price">${fmt(p.preco)}<br><small>por ${esc(p.medida||"unidade")}</small></div>`
            : `<div class="card-noprice">sob consulta</div>`}
          <button type="button" class="card-add" data-add="${esc(p.id)}" aria-label="Adicionar à sacola" ${isOut ? "disabled" : ""}>
            ${isOut
              ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>`
              : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`}
          </button>
        </div>
      </div>
    </article>
    `;
  }).join("");

  $$("[data-add]", grid).forEach(btn => {
    btn.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      const p = produtos.find(x => x.id === btn.dataset.add);
      if (p) addToCart(p);
    });
  });
  $$("[data-nav]", grid).forEach(a => {
    a.addEventListener("click", e => {
      e.preventDefault();
      openProduct(a.dataset.nav, true);
    });
  });
}

/* =========================================================
   CART RENDER (pill + drawer)
   ========================================================= */
function renderCartPill(bump=false) {
  const el = $("#cartPill");
  el.textContent = totalItens();
  if (bump) {
    el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  }
}

function renderDrawer() {
  const body = $("#drawerBody");
  const foot = $("#drawerFoot");
  const items = state.carrinho;
  $("#drawerCount").textContent = items.length
    ? `· ${totalItens()} ${totalItens() === 1 ? "item" : "itens"}`
    : "vazio";

  if (!items.length) {
    body.innerHTML = `
      <div class="cart-empty">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <h3>Sua sacola está vazia</h3>
        <p>Adicione produtos para fechar pelo WhatsApp.</p>
        <button type="button" class="btn btn-outline btn-sm" id="emptyContinue">Continuar comprando</button>
      </div>`;
    $("#emptyContinue").addEventListener("click", closeCart);
    foot.innerHTML = "";
    return;
  }

  body.innerHTML = items.map(i => `
    <div class="cart-row" data-id="${esc(i.id)}">
      <div class="cart-thumb">${imgOrPh(i.imagem, i.nome)}</div>
      <div class="cart-info">
        <p class="cart-name">${esc(i.nome)}</p>
        <p class="cart-meta">${esc(i.medida||"unidade")}</p>
        <div class="stepper" style="margin-top:8px">
          <button type="button" data-dec aria-label="Diminuir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <span class="qty">${i.qty}</span>
          <button type="button" data-inc aria-label="Aumentar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div class="cart-side">
        <button type="button" class="cart-remove" data-del aria-label="Remover">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>

          ? `<p class="cart-price">${fmt(i.preco * i.qty)}</p>`

  `).join("");

  $$(".cart-row", body).forEach(row => {
    const id = row.dataset.id;
    row.querySelector("[data-inc]").addEventListener("click", () => changeQty(id, +1));
    row.querySelector("[data-dec]").addEventListener("click", () => changeQty(id, -1));
    row.querySelector("[data-del]").addEventListener("click", () => removeFromCart(id));
  });

  foot.innerHTML = `
    <form class="cart-form" id="checkoutForm" novalidate>
      <div class="field" data-f="nome">
        <label for="f-nome">Nome</label>
        <input id="f-nome" class="input" type="text" autocomplete="name" placeholder="Seu nome" required />
        <span class="err">Informe seu nome.</span>
      </div>
      <div class="field" data-f="whats">
        <label for="f-whats">WhatsApp</label>
        <input id="f-whats" class="input" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999" required />
        <span class="err">Informe seu WhatsApp.</span>
      </div>
    </form>
    <div class="summary">
      <div class="summary-row"><span>Itens</span><span>${totalItens()}</span></div>
      ${temPreco() ? `<div class="summary-row total"><span>Total</span><span>${fmt(totalValor())}</span></div>` : ""}
    </div>
    <button type="button" class="btn btn-whatsapp" id="checkoutBtn">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Finalizar pedido
    </button>`;
}

/* =========================================================
   DRAWER / OVERLAY
   ========================================================= */
function openCart() {
  renderDrawer();
  $("#overlay").classList.add("show");
  $("#drawer").classList.add("show");
  $("#drawer").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}
function closeCart() {
  $("#overlay").classList.remove("show");
  $("#drawer").classList.remove("show");
  $("#drawer").setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}
$("#openCartBtn").addEventListener("click", openCart);
$("#closeCartBtn").addEventListener("click", closeCart);
$("#overlay").addEventListener("click", closeCart);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeCart(); closeModal(); }
});

/* =========================================================
   CHECKOUT (WhatsApp)
   ========================================================= */
document.addEventListener("click", e => {
  const btn = e.target.closest("#checkoutBtn");
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = "Aguarde…";

  const nome = document.getElementById("f-nome");
  const whats = document.getElementById("f-whats");
  const fn = document.querySelector("[data-f=nome]");
  const fw = document.querySelector("[data-f=whats]");

  let ok = true;
  [fn, fw].forEach(el => el.classList.remove("error"));
  if (!nome.value.trim()) { fn.classList.add("error"); ok = false; }
  if (!whats.value.trim()) { fw.classList.add("error"); ok = false; }
  if (!ok) { btn.disabled = false; btn.textContent = "Finalizar pedido"; return; }

  let msg = "*Pedido Tirzeton Labs*%0A%0A";
  state.carrinho.forEach(i => {
    msg += `• ${i.qty}x ${i.nome}`;
    if (i.preco != null) msg += ` - ${fmt(i.preco * i.qty)}`;
    msg += "%0A";
  });
  msg += `%0A*Cliente*: ${nome.value.trim()}`;
  msg += `%0A*WhatsApp*: ${whats.value.trim()}`;

  const cleanNum = whatsappNumero.replace(/\D/g, "");
  const url = `https://wa.me/${cleanNum}?text=${msg}`;
  window.open(url, "_blank");

  btn.disabled = false;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> Finalizar pedido`;
});

/* =========================================================
   SEARCH
   ========================================================= */
let searchTimer;
$("#searchInput").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.busca = $("#searchInput").value;
    renderGrid();
  }, 250);
});

/* =========================================================
   MODAL
   ========================================================= */
function openProduct(id, pushState=true) {
  const p = bySlug(id);
  if (!p) return;
  state.modalProductId = p.id;
  state.modalSlide = 0;
  renderModal(p);
  $("#modal").classList.add("show");
  document.body.style.overflow = "hidden";
  if (pushState) {
    const url = new URL(window.location);
    url.searchParams.set("p", p.id);
    history.pushState({p: p.id}, "", url);
  }
}

function closeModal() {
  $("#modal").classList.remove("show");
  document.body.style.overflow = "";
  state.modalProductId = null;
  if (window.location.search.includes("p=")) {
    history.pushState({}, "", window.location.pathname);
  }
}

$("#modal").addEventListener("click", e => {
  if (e.target === $("#modal")) closeModal();
});

function renderModal(p) {
  const card = $("#modalCard");
  const imgs = p.imagens && p.imagens.length ? p.imagens : [""];
  const badges = (p.badges||[]).map(b => `<span class="badge badge--${esc(b)}">${BADGE_LABELS[b]||b}</span>`).join("");

  card.innerHTML = `
    <button class="btn-icon modal-close" id="modalCloseBtn" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button class="btn-icon modal-share" id="modalShareBtn" aria-label="Compartilhar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    </button>
    <div class="gallery" id="modalGallery">
      <div class="gallery-main" id="galleryMain">
        ${imgOrPh(imgs[0], p.nome)}
      </div>
      ${imgs.length > 1 ? `
      <div class="gallery-thumbs" id="galleryThumbs">
        ${imgs.map((img, i) => `<button class="gallery-thumb${i===0?" active":""}" data-i="${i}">
          <img src="${esc(img)}" alt="${esc(p.nome)}" />
        </button>`).join("")}
      </div>` : ""}
    </div>
    <div class="modal-body">
      <p class="modal-cat">${esc(p.categoria||"")}</p>
      <h2 class="modal-title">${esc(p.nome)}</h2>
      ${badges ? `<div class="modal-badges">${badges}</div>` : ""}
      <p class="modal-desc">${(p.descricao||"").replace(/\n/g, "<br>")}</p>
      <div class="modal-price-row">
        <span class="label">${p.preco != null ? "Preço" : "Disponibilidade"}</span>
        <span class="value">${p.preco != null ? fmt(p.preco) : "Sob consulta"} ${p.preco != null ? `<small>/ ${esc(p.medida||"unidade")}</small>` : ""}</span>
      </div>
      <div class="modal-bottom">
        <div class="stepper">
          <button type="button" id="modalDec" aria-label="Diminuir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <span class="qty" id="modalQty">1</span>
          <button type="button" id="modalInc" aria-label="Aumentar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <button type="button" class="btn btn-primary" id="modalAddBtn">Adicionar à sacola</button>
      </div>
    </div>`;

  // Close
  $("#modalCloseBtn").addEventListener("click", closeModal);

  // Share
  $("#modalShareBtn").addEventListener("click", () => {
    const url = `${window.location.origin}${window.location.pathname}?p=${esc(p.id)}`;
    if (navigator.share) navigator.share({title: p.nome, url});
    else navigator.clipboard?.writeText(url).then(() => toast("Link copiado"));
  });

  // Gallery thumbs
  if (imgs.length > 1) {
    const thumbs = $$("#galleryThumbs button");
    const main = $("#galleryMain");

    thumbs.forEach(t =>
      t.addEventListener("click", () => {
        const i = parseInt(t.dataset.i);
        main.innerHTML = imgOrPh(imgs[i], p.nome);
        thumbs.forEach((th, idx) => th.classList.toggle("active", idx === i));
      })
    );
  }

  // Qty stepper
  let qty = 1;
  const qtyEl = $("#modalQty");
  $("#modalInc").addEventListener("click", () => { qty = Math.min(99, qty + 1); qtyEl.textContent = qty; });
  $("#modalDec").addEventListener("click", () => { qty = Math.max(1, qty - 1); qtyEl.textContent = qty; });

  // Add to cart from modal
  $("#modalAddBtn").addEventListener("click", () => {
    addToCart(p, qty);
    qty = 1;
    qtyEl.textContent = 1;
  });
}

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer;
function toast(msg) {
  const el = $("#toast");
  $("#toastText").textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

/* =========================================================
   POPSTATE (navegação histórico)
   ========================================================= */
window.addEventListener("popstate", e => {
  if (e.state && e.state.p) {
    openProduct(e.state.p, false);
  } else {
    closeModal();
  }
});

/* =========================================================
   BOOKMARK / INSTALL BANNER
   ========================================================= */
(function() {
  const banner = $("#bookmarkBanner");
  const key = "tirzeton_bm_closed";

  function canShow() {
    if (localStorage.getItem(key)) return false;
    if (window.matchMedia("(display-mode: standalone)").matches) return false;
    if (navigator.standalone) return false;
    return true;
  }

  function show() {
    banner.classList.add("show");
    requestAnimationFrame(() => banner.classList.add("in"));
  }

  $("#bookmarkCloseBtn").addEventListener("click", () => {
    localStorage.setItem(key, "1");
    banner.classList.remove("in");
    setTimeout(() => banner.classList.remove("show"), 300);
  });

  $("#bookmarkAddBtn").addEventListener("click", () => {
    if (navigator.share) {
      navigator.share({title: document.title, url: window.location.href});
    } else {
      toast("Adicione aos favoritos pelo menu do navegador");
    }
  });

  if (canShow()) setTimeout(show, 2000);
})();

/* =========================================================
   INIT
   ========================================================= */
(async function init() {
  renderSkeletons();
  loadCart();
  renderCartPill();
  await loadDados();
  renderFilters();
  renderGrid();

    // Footer WhatsApp link
  const wa = document.getElementById("footerWa");
  wa.href = "https://wa.me/" + WHATSAPP_NUMERO;
  wa.textContent = "+55 " + WHATSAPP_NUMERO.slice(2,4) + " " + WHATSAPP_NUMERO.slice(4,8) + "-" + WHATSAPP_NUMERO.slice(8);

  // Check: was product opened via URL ?p=
  const params = new URLSearchParams(window.location.search);
  const pSlug = params.get("p");
  if (pSlug) {
    const found = bySlug(pSlug);
    if (found) openProduct(found.id, false);
  }
})();
</script>
